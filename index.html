<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>保险柜抽奖</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
canvas{position:absolute;left:0;top:0}
.b{position:absolute;color:#fff;background:rgba(255,255,255,.1);border:1px solid #f5c842;font-size:16px;text-align:center;line-height:38px;height:40px;cursor:pointer;box-sizing:border-box}
.b:active{background:rgba(255,255,255,.3)}
#ti{position:absolute;left:440px;top:674px;width:400px;height:44px;background:rgba(0,0,0,.6);border:1px solid #f5c842;color:#f5c842;font-size:34px;font-weight:bold;text-align:center;display:none;font-family:inherit;outline:none}
#vp{position:absolute;left:20px;top:300px;width:300px;padding:14px;background:rgba(10,14,20,.92);border:1px solid #f5c842;color:#fff;display:none;font-size:16px;box-sizing:border-box}
#vp input{width:100%;margin:6px 0 14px}
#start{position:absolute;inset:0;background:rgba(0,0,0,.85);color:#f5c842;font-size:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9}
</style></head><body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas>
<div class="b" id="sb" style="left:20px;top:668px;width:196px"></div>
<div class="b" id="tb" style="left:1115px;top:14px;width:150px">编辑标题</div>
<div class="b" id="rb" style="left:1005px;top:14px;width:100px">重置奖池</div>
<input id="ti" maxlength="16"><div id="vp">音效<input type="range" id="sv" min="0" max="1" step=".05">背景音乐<input type="range" id="bv" min="0" max="1" step=".05"></div>
<div id="start">点击屏幕开始</div></div>
<script>
const W=1280,H=720,$=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),stage=$('stage');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`scale(${s})`;stage.style.left=(innerWidth-W*s)/2+'px';stage.style.top=(innerHeight-H*s)/2+'px'}
addEventListener('resize',fit);fit();
const TIERS={blue:{c:'#377deb',w:50,s:1},purple:{c:'#9b50e1',w:30,s:2},gold:{c:'#f5be28',w:15,s:3.4},red:{c:'#e63232',w:5,s:5}};
const SCN=[{n:'军绿',p:'images/',fo:[.05331,.10448,.89338,.79449]},{n:'深蓝',p:'images/scene2/',fo:[.05239,.10148,.89636,.79019]}];
const SND={click:['click_password',.9],decrypt:['decrypting',.5],done:['unlock_done',1],box:['box_open',1],open:['unlock_open',1],rc:['reveal_common',1],rr:['reveal_rare',1],bgm:['bgm',.35]};
let S=JSON.parse(localStorage.getItem('lk')||'{}');S={sv:.8,bv:.6,title:'保 险 柜 抽 奖',scene:0,...S};
const save=()=>localStorage.setItem('lk',JSON.stringify(S));
const IMG={};function img(p){if(!IMG[p]){IMG[p]=new Image();IMG[p].src=p}return IMG[p]}
const snd={};for(const k in SND){snd[k]=new Audio('sounds/'+SND[k][0]+'.wav');snd[k].preload='auto'}snd.bgm.loop=snd.decrypt.loop=true;
function play(k){const a=snd[k];if(!a)return;a.volume=Math.min(1,(k=='bgm'?S.bv:S.sv*SND[k][1]));if(k!='bgm'&&k!='decrypt')a.currentTime=0;a.play().catch(()=>{})}
function stop(k){snd[k].pause();snd[k].currentTime=0}
function applyVol(){snd.bgm.volume=S.bv;snd.decrypt.volume=Math.min(1,S.sv*.5)}
let prizes=[],pool=[],opened={},sel=null,st='menu',t0=0,cur=null,prize=null,pz={},blurBg={};
fetch('prizes.json').then(r=>r.json()).then(d=>{prizes=d;resetPool()}).catch(()=>{});
function resetPool(){pool=prizes.slice();newGroup()}
function newGroup(){opened={};sel=null;grp=Math.min(24,pool.length)}let grp=0;
function pick(){const ts=Object.keys(TIERS).filter(t=>pool.some(p=>p.tier==t));const tot=ts.reduce((a,t)=>a+TIERS[t].w,0);let r=Math.random()*tot,t=ts[0];for(const x of ts){if((r-=TIERS[x].w)<0){t=x;break}}
 const l=pool.filter(p=>p.tier==t),p=l[Math.random()*l.length|0];pool.splice(pool.indexOf(p),1);return p}
function bgFor(){const p=SCN[S.scene].p+'background.png',im=img(p);if(!im.complete||!im.naturalWidth)return null;
 if(!blurBg[p]){const o=document.createElement('canvas');o.width=W;o.height=H;const c=o.getContext('2d');c.filter='blur(8px)';c.drawImage(im,-20,-20,W+40,H+40);c.filter='none';c.fillStyle='rgba(0,0,0,.16)';c.fillRect(0,0,W,H);blurBg[p]=o}return blurBg[p]}
const cell=i=>[640+((i%6)-2.5)*156,179+(i/6|0)*106];
function txt(s,x,y,sz,col,al){g.font=`bold ${sz}px "Microsoft YaHei","PingFang SC",sans-serif`;g.fillStyle=col||'#fff';g.textAlign=al||'center';g.textBaseline='middle';g.fillText(s,x,y)}
function cover(im,x,y,w,h){if(!im.complete||!im.naturalWidth)return;const k=Math.max(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*k,dh=im.naturalHeight*k;g.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh)}
function contain(im,cx,cy,w,h){if(!im.complete||!im.naturalWidth)return;const k=Math.min(w/im.naturalWidth,h/im.naturalHeight),dw=im.naturalWidth*k,dh=im.naturalHeight*k;g.drawImage(im,cx-dw/2,cy-dh/2,dw,dh)}
function drawMenu(){const sc=SCN[S.scene],P=sc.p,fo=sc.fo;const b=bgFor();if(b)g.drawImage(b,0,0);else{g.fillStyle='#10161c';g.fillRect(0,0,W,H)}
 const ox=172,oy=126,ow=936,oh=424;g.save();g.beginPath();g.rect(ox,oy,ow,oh);g.clip();cover(img(P+'cabinet_wall.png'),ox,oy,ow,oh);g.restore();
 for(let i=0;i<24;i++){const [cx,cy]=cell(i),p=opened[i];const im=img(p?P+'safe_open_'+p.tier+'.png':P+'safe_closed.png');cover(im,cx-75,cy-50,150,100);
  if(p){const pi=img(p.image);contain(pi,cx,cy+6,92,62)}
  if(sel==i&&!p){g.strokeStyle='#f5c842';g.lineWidth=3;g.strokeRect(cx-75,cy-50,150,100);g.fillStyle='rgba(0,0,0,.6)';g.fillRect(cx-48,cy-19,96,38);g.strokeRect(cx-48,cy-19,96,38);txt('打 开',cx,cy,20,'#f5c842')}}
 const fw=ow/fo[2],fh=oh/fo[3],fi=img(P+'cabinet_frame.png');if(fi.complete)g.drawImage(fi,ox-fo[0]*fw,oy-fo[1]*fh,fw,fh);
 const au=img('images/audio_idle.png');if(au.complete){const aw=270,ah=aw*au.naturalHeight/au.naturalWidth;g.drawImage(au,-9,H-30-ah+ah*.09,aw*1.0,ah)}
 txt(`本组 ${Object.keys(opened).length}/${grp}　奖池剩余 ${pool.length}`,1262,700,20,'#cfd6e0','right');
 if(!pool.length&&!prizes.length)txt('读取 prizes.json 中…（需通过网址打开）',640,360,26)}
const TH=document.createElement('div');
function drawPuzzle(now){g.fillStyle='rgba(0,0,0,.78)';g.fillRect(0,0,W,H);txt('解 密',640,200,44,'#f5c842');txt(`点击屏幕 / 按空格，在绿色区内停住指针（${pz.n}/3）`,640,262,22);
 const x0=340,w=600,y=360;g.fillStyle='#222';g.fillRect(x0,y-24,w,48);g.fillStyle=pz.miss>now?'rgba(230,50,50,.8)':'rgba(60,200,90,.85)';g.fillRect(x0+pz.z,y-24,pz.zw,48);
 g.strokeStyle='#f5c842';g.lineWidth=2;g.strokeRect(x0,y-24,w,48);const ph=((now-pz.t)*pz.sp/1000)%(2*w),m=ph<w?ph:2*w-ph;pz.m=m;g.fillStyle='#fff';g.fillRect(x0+m-3,y-34,6,68)}
function newZone(){pz.zw=Math.max(60,150-pz.n*35);pz.z=60+Math.random()*(600-pz.zw-120);pz.sp=520+pz.n*180}
function startPuzzle(i){cur=i;st='puzzle';pz={n:0,t:performance.now(),miss:0};newZone();play('decrypt')}
function hitPz(){const now=performance.now();if(pz.m>=pz.z&&pz.m<=pz.z+pz.zw){pz.n++;play('click');if(pz.n>=3){stop('decrypt');play('done');setTimeout(()=>{play('open');beginSearch()},350)}else{newZone();pz.t=now}}else pz.miss=now+300}
function beginSearch(){prize=pick();play('box');st='search';t0=performance.now()}
function drawSearch(now){g.fillStyle='rgba(0,0,0,.85)';g.fillRect(0,0,W,H);const d=TIERS[prize.tier].s*1000,p=Math.min(1,(now-t0)/d);
 txt('搜 索 中 …',640,300,44,'#f5c842');g.strokeStyle='#f5c842';g.strokeRect(340,380,600,24);g.fillStyle='#f5c842';g.fillRect(342,382,596*p,20);
 const sx=340+((now/6)%600);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(sx,372,4,40);if(p>=1){st='reveal';t0=now;play(['gold','red'].includes(prize.tier)?'rr':'rc')}}
function drawReveal(now){const c=TIERS[prize.tier].c,a=Math.min(1,(now-t0)/400);g.fillStyle='rgba(0,0,0,.88)';g.fillRect(0,0,W,H);
 const gr=g.createRadialGradient(640,330,20,640,330,380);gr.addColorStop(0,c+'cc');gr.addColorStop(1,'transparent');g.globalAlpha=a*.6;g.fillStyle=gr;g.fillRect(0,0,W,H);g.globalAlpha=a;
 contain(img(prize.image),640,320,420,360);txt(prize.name,640,556,44,c);txt('点击屏幕继续',640,640,20,'#aab');g.globalAlpha=1}
function loop(now){g.clearRect(0,0,W,H);drawMenu();
 g.fillStyle='#f5c842';g.font='bold 34px "Microsoft YaHei",sans-serif';if(st=='menu'&&!editing)txt(S.title,640,23,34,'#f5c842');
 if(st=='puzzle')drawPuzzle(now);else if(st=='search')drawSearch(now);else if(st=='reveal')drawReveal(now);requestAnimationFrame(loop)}
let editing=false;
function pos(e){const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]||e.changedTouches[0]:e;return[(t.clientX-r.left)*W/r.width,(t.clientY-r.top)*H/r.height]}
cv.addEventListener('pointerdown',e=>{const[x,y]=pos(e);$('vp').style.display=(st=='menu'&&x<290&&y>520)?($('vp').style.display=='block'?'none':'block'):'none';
 if(st=='puzzle')return hitPz();
 if(st=='reveal'){if(performance.now()-t0<500)return;opened[cur]=prize;st='menu';sel=null;if(Object.keys(opened).length>=grp&&pool.length){setTimeout(newGroup,1200)}return}
 if(st!='menu'||editing)return;
 for(let i=0;i<24;i++){const[cx,cy]=cell(i);if(Math.abs(x-cx)<75&&Math.abs(y-cy)<50&&!opened[i]){if(sel==i&&Math.abs(x-cx)<48&&Math.abs(y-cy)<19){if(pool.length)startPuzzle(i)}else{sel=i;play('click')}return}}sel=null});
addEventListener('keydown',e=>{if(e.code=='Space'&&st=='puzzle'){e.preventDefault();hitPz()}if(e.key=='Enter'&&editing)endEdit(true);if(e.key=='Escape'&&editing)endEdit(false)});
function setScene(n){S.scene=n;$('sb').textContent='场景：'+SCN[n].n+'（点击切换）';save()}
$('sb').onclick=()=>{if(st=='menu')setScene((S.scene+1)%SCN.length)};setScene(S.scene);
function endEdit(ok){if(!editing)return;editing=false;if(ok)S.title=$('ti').value.trim()||'保 险 柜 抽 奖';save();$('ti').style.display='none';$('tb').textContent='编辑标题'}
$('tb').onclick=()=>{if(editing)endEdit(true);else if(st=='menu'){editing=true;$('ti').value=S.title;$('ti').style.display='block';$('tb').textContent='完 成';$('ti').focus()}};
$('rb').onclick=()=>{if(st=='menu'&&confirm('重置奖池并重新开始？'))resetPool()};
$('sv').value=S.sv;$('bv').value=S.bv;$('sv').oninput=()=>{S.sv=+$('sv').value;applyVol();save()};$('bv').oninput=()=>{S.bv=+$('bv').value;applyVol();save()};
$('start').onclick=()=>{$('start').remove();applyVol();play('bgm')};
requestAnimationFrame(loop);
</script></body></html>
